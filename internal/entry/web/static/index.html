<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ainovel-cli 工作台</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar"><div><strong>ainovel-cli</strong><span id="model">连接中...</span></div><div id="status">READY</div></header>
  <main class="workspace">
    <aside class="panel state"><h2>状态</h2><dl id="state"></dl></aside>
    <section class="center"><section class="panel events"><h2>事件</h2><div id="events" class="scroll"></div></section><section class="panel stream"><h2>流式输出</h2><pre id="stream" class="scroll"></pre></section></section>
    <aside class="panel detail"><h2>详情</h2><div id="detail" class="scroll"></div><div class="image-slot"><span>Unit 图片预留</span><img id="unit-image" alt="当前 unit 图片" hidden></div></aside>
  </main>
  <footer class="controls"><input id="prompt" placeholder="输入创作需求、继续内容或干预意见"><button id="send">发送</button><button id="pause">暂停</button><button id="abort">中止</button></footer>
  <script src="/static/app.js"></script>
</body>
</html>
