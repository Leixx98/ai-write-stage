services:
  ainovel:
    image: ghcr.io/voocel/ainovel-cli:latest
    build:
      context: .
    environment:
      AINOVEL_ROOT: /workspace
    volumes:
      - ./config:/root/.ainovel
      - ./workspace:/workspace
    ports:
      - "127.0.0.1:8080:8080"
    command: ["--listen", "0.0.0.0:8080"]
