services:
  ainovel:
    image: ghcr.io/leixx98/ai-write-stage:latest
    build:
      context: .
    environment:
      AINOVEL_ROOT: /workspace
    volumes:
      - ./config:/root/.ainovel
      - ./workspace:/workspace
    ports:
      - "127.0.0.1:5688:5688"
    command: ["--listen", "0.0.0.0:5688"]
